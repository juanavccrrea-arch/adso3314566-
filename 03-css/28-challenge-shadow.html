    <link rel="stylesheet" href="../src/css/03-Css.css">
    <style>
        /* Estilos adicionales para el pixel art */
        .pixel-art-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(25, 20px);
            grid-template-rows: repeat(25, 20px);
            gap: 1px;
            background-color: #1a1a1a;
            border: 3px solid #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .pixel {
            width: 20px;
            height: 20px;
        }

        /* Colores para los píxeles */
        .black { background-color: #000000; }
        .yellow { background-color: #FFD700; }
        .dark-yellow { background-color: #DAA520; }
        .white { background-color: #FFFFFF; }
    </style>
</head>
