<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-Filters</title>
    <link rel="stylesheet" href="../src/css/03-Css.css">

    <style>
        section{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            justify-items: center;
        }

        article{
            text-align: center;
        }

        article h3{
            margin-bottom: 10px;
        }

        img{
            width: 250px;
            border-radius: 10px;
            transition: all 0.5s ease;
        }

        img:hover{
            filter: none;
            transform: scale(1.05);
        }

        /* FILTERS */

        .blur{
            filter: blur(5px);
        }

        .brightness{
            filter: brightness(1.5);
        }

        .contrast{
            filter: contrast(180%);
        }

        .saturate{
            filter: saturate(250%);
        }

        .grayscale{
            filter: grayscale(100%);
        }

        .sepia{
            filter: sepia(100%);
        }

        .invert{
            filter: invert(100%);
        }

        .opacity{
            filter: opacity(0.5);
        }

        .hue{
            filter: hue-rotate(180deg);
        }

        .shadow{
            filter: drop-shadow(10px 10px 10px rgba(0,0,0,.8));
        }
    </style>
</head>

<body>
    <a href="../03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>

    <main>
        <header>
            <h1>31 Filters</h1>
            <h2>Defines visual effects (like blur and saturation).</h2>
        </header>

        <section>

            <article>
                <h3>Blur</h3>
                <img class="blur" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Brightness</h3>
                <img class="brightness" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Contrast</h3>
                <img class="contrast" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Saturate</h3>
                <img class="saturate" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Grayscale</h3>
                <img class="grayscale" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Sepia</h3>
                <img class="sepia" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Invert</h3>
                <img class="invert" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Opacity</h3>
                <img class="opacity" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Hue Rotate</h3>
                <img class="hue" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

            <article>
                <h3>Drop Shadow</h3>
                <img class="shadow" src="../src/imgs/pikachu.jpg" alt="pikachu">
            </article>

        </section>
    </main>
</body>

</html>
