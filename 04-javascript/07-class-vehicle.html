<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>07-class-vehicle</title>

    <link rel="stylesheet" href="/src/css/04-JavaScript.css">

    <style>
        .vehicle {
            &.dark {
                background-color: #13171A;

                header {
                    button.mode {
                        background: url(../src/imgs/vehicles/Mode-dark.png)
                            no-repeat center / cover;
                    }
                }
            }

            background-color: #ffffff;
            border-radius: 8px;
            margin: 0 auto;
            height: 576px;
            padding: 12px;
            width: 356px;
        }

        .vehicle header {
            align-items: center;
            display: flex;
            justify-content: space-between;
        }

        .vehicle header figure {
            background: url(../src/imgs/vehicles/180f6303-0393-48ad-ae80-9566b05ab46b\ 1.png)
                no-repeat center / cover;
            height: 49px;
            margin: 0;
            width: 220px;
        }

        .vehicle header button.mode {
            background: url(../src/imgs/vehicles/Mode-dark.png)
                no-repeat center / cover;
            border: none;
            cursor: pointer;
            height: 60px;
            transition: transform 0.4s ease-in;
            width: 100px;

            &.hover {
                transform: scale(1.1);
            }
        }
    </style>
</head>

<body>

    <!-- BOTÓN HOME -->
    <a href="../04-javascript/index.html" class="btn-home">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            fill="black"
            viewBox="0 0 256 256"
        >
            <path
                d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H152Zm96,88H112V160h32Z"
            />
        </svg>
    </a>

    <main>

        <!-- TÍTULO -->
        <header>
            <h1>07-class-vehicle</h1>

            <h2>
                Create and manipulate a vehicle object with properties.
            </h2>
        </header>

        <section>

            <!-- FIGMA -->
            <iframe
                style="border: 1px solid rgba(0, 0, 0, 0.1);"
                width="800"
                height="450"
                src="https://embed.figma.com/design/1iTc3IxCd6WwJ2fC1gcMI3/Sin-t%C3%ADtulo?node-id=0-1&embed-host=share"
                allowfullscreen>
            </iframe>

            <!-- VEHÍCULO -->
            <div class="vehicle">

                <!-- HEADER DEL VEHÍCULO -->
                <header>

                    <figure class="logo"></figure>

                    <button class="mode"></button>

                </header>

                <!-- NAVEGACIÓN -->
                <nav>

                    <button class="prev"></button>

                    <figure class="brand"></figure>

                    <button class="next"></button>

                </nav>

            </div>

        </section>

    </main>

    <script>

        // VEHÍCULO
        const vhc = document.querySelector('.vehicle');

        // BOTÓN DE MODO
        const mode = document.querySelector('.mode');

        // PREFERENCIA DEL SISTEMA
        const darkMode = window.matchMedia(
            '(prefers-color-scheme: dark)'
        );

        // ACTUALIZAR TEMA
        const updateTheme = (e) => {
            vhc.classList.toggle('dark', e.matches);
        };

        // DETECTAR CAMBIO DEL TEMA DEL SISTEMA
        darkMode.addEventListener(
            'change',
            updateTheme
        );

        // APLICAR TEMA INICIAL
        updateTheme(darkMode);

        // CAMBIAR TEMA MANUALMENTE
        mode.addEventListener('click', function () {

            vhc.classList.toggle('dark');

        });

    </script>

</body>
</html>
